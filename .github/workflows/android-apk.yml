name: Build Android APK

# Builds an installable APK on GitHub's servers (free for personal repos).
# Run it from the repo's "Actions" tab → "Build Android APK" → "Run workflow",
# or push a tag like v1.0.1. The APK appears under Releases (open it on your phone).

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/GOAL-${VERSION}.apk"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: GOAL-apk
          path: dist/*.apk

      - name: Publish as a release (download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: GOAL ${{ env.VERSION }} (build ${{ github.run_number }})
          files: dist/*.apk
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
